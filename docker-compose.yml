version: '3.8'

services:
  neo4j:
    image: neo4j:5.13
    container_name: dickon-neo4j
    ports:
      - "9474:7474"  # HTTP
      - "9687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/dickon-ktb3
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_connector_bolt_tls__level=DISABLED
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "dickon-ktb3", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: dickon-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dickon-ktb3
      - PORT=4000
      - LOG_LEVEL=debug
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./data:/app/data:ro
    depends_on:
      neo4j:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: dickon-frontend
    ports:
      - "9173:9173"
    environment:
      - VITE_GRAPHQL_URL=http://localhost:4000/graphql
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
    depends_on:
      - backend
    command: npm run dev

volumes:
  neo4j_data:
  neo4j_logs:
